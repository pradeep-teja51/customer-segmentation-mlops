
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run tests
        run: python -m pytest tests -v

      - name: Build Docker image
        run: docker build -t customer-segmentation-app .

      - name: Smoke test the container
        run: |
          docker run -d -p 8000:8000 --name seg-app customer-segmentation-app

          for i in $(seq 1 20); do
            if ! docker inspect -f '{{.State.Running}}' seg-app | grep -q true; then
              echo "Container stopped unexpectedly"
              docker logs seg-app
              exit 1
            fi

            if curl --fail --silent --show-error http://localhost:8000/; then
              echo "Container smoke test passed"
              exit 0
            fi

            echo "Waiting for API startup: attempt $i/20"
            sleep 3
          done

          echo "API did not respond"
          docker ps -a
          docker logs seg-app
          exit 1
