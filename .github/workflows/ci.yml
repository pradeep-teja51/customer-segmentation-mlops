name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run tests
        run: python -m pytest tests -v

      - name: Build Docker image
        run: docker build -t customer-segmentation-app .

      - name: Smoke test the container
        run: |
          docker run -d -p 8000:8000 --name seg-app customer-segmentation-app
          curl --fail --retry 10 --retry-delay 3 --retry-connrefused http://localhost:8000/