name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run tests
        run: python -m pytest tests -v

      - name: Build Docker image
        run: docker build -t customer-segmentation-app .

      - name: Smoke test the container
        run: |
          docker run -d -p 8000:8000 --name seg-app customer-segmentation-app
          for i in $(seq 1 20); do
            if curl --fail --silent http://localhost:8000/; then
              echo "Service is up"
              exit 0
            fi
            sleep 3
          done
          echo "Service did not respond. Container logs:"
          docker logs seg-app
          exit 1